name: Publish readll web flasher

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build, package, and verify public site
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B build/pages -D SDKCONFIG=build/pages/sdkconfig -D SDKCONFIG_DEFAULTS=sdkconfig.ci set-target esp32s3
          idf.py -B build/pages -D SDKCONFIG=build/pages/sdkconfig -D SDKCONFIG_DEFAULTS=sdkconfig.ci build
          python3 tools/package_flash.py build/pages build/pages-package
          python3 tools/stage_public_flash.py _site --package-dir build/pages-package
          python3 tools/verify_flash_bundle.py _site
          python3 -m unittest \
            tools.rss_test.test_rss.StaticAndFixtureContractTests.test_pages_deployment_contract \
            tools.rss_test.test_rss.StaticAndFixtureContractTests.test_release_manifest_schemas_do_not_conflict \
            tools.rss_test.test_rss.StaticAndFixtureContractTests.test_usb_product_descriptor_uses_readll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
